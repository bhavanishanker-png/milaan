[project]
name = "milaan"
version = "0.1.0"
description = "Autonomous settlement reconciliation controller"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "duckdb>=1.0",
    "structlog>=24.1",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "chromadb>=0.5",
    "streamlit>=1.38",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
